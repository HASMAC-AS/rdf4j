name: SPARQL corpus bootstrap
on:
  push:
    branches: [test/qlever-jena-corpus-20261004]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build pinned Jena query-engine modules and test classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export upstream
          git init upstream/jena
          git -C upstream/jena fetch --depth=1 https://github.com/apache/jena.git df0d523eed42cd0b7c9ef11c74eeb0a63302a423
          git -C upstream/jena checkout --detach FETCH_HEAD
          modules=jena-tdb1,jena-tdb2,jena-serviceenhancer,jena-text,jena-geosparql,jena-querybuilder,jena-rdfconnection
          mvn -B -f upstream/jena/pom.xml -pl "$modules" -am -DskipTests -Dmaven.javadoc.skip=true install > export/jena-build.log 2>&1
          for module in ${modules//,/ }; do
            mvn -B -f "upstream/jena/$module/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=test -DoutputDirectory="$PWD/export/jars/$module" >> export/jena-build.log 2>&1
          done
          tar --exclude=.git -czf export/jena-built-modules.tar.gz upstream/jena
          cd export
          sha256sum jena-built-modules.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparql-corpus-jena-modules
          path: export/
          retention-days: 7
          compression-level: 0
