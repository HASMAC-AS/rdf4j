name: LMDB checkpoint ownership verification

on:
  push:
    branches:
      - GH-0000-lmdb-ownership-ablation-15fe7d5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dependencies and compile
        run: mvn -B --no-transfer-progress -T 2C -Pquick -DskipTests -DskipITs -Dmaven.javadoc.skip=true -Djapicmp.skip=true install
      - name: Focused ownership and coordinate regression tests
        id: focused
        run: |
          mvn -B --no-transfer-progress -pl core/sail/lmdb -PskipSlowTests,-formatting -DskipITs -Dmaven.javadoc.skip=true -Djapicmp.skip=true -Denforcer.skip=true -Danimal.sniffer.skip=true \
            '-Dtest=NativeResultWrapperBindingTest,LmdbValuesPlanOwnershipTest,LmdbPatternPlanOwnershipTest,NativeWorkerConditionFrameLifetimeTest,NativeWrapperConstantCaptureTest,LmdbNativeEntryBindingSeedTest,NativeValueResolutionContractTest,NativeResultMaterializerTest,NativeGroupResultCursorTest,NativeLazyResultReplayTest,LmdbNativeIrFactorCoordinateTransportTest,LmdbNativeLazyProjectedResultTest,LmdbNativeGenericBridgeScopeTest,LmdbNativeIrOptionalFanoutCoordinateTest,KernelResultCoordinatesTest' \
            test
      - name: Summarize failing test reports
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports=glob.glob('core/sail/lmdb/target/surefire-reports/TEST-*.xml')
          n=0
          for f in reports:
              root=ET.parse(f).getroot()
              cases=root.findall('.//testcase')
              for case in cases:
                  issue=case.find('failure')
                  if issue is None: issue=case.find('error')
                  if issue is not None:
                      n+=1
                      print(f"{case.get('classname')}#{case.get('name')}: {issue.get('message','')[:400]}")
          print(f"XML reports: {len(reports)}; failing/error cases: {n}")
          PY
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-ownership-surefire
          path: core/sail/lmdb/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  coordinate-ablation:
    needs: ownership-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and generate JMH harness
        run: |
          mvn -B --no-transfer-progress -T 2C -Pquick -DskipTests -DskipITs -Dmaven.javadoc.skip=true -Djapicmp.skip=true install
          mvn -B --no-transfer-progress -pl core/sail/lmdb -PskipSlowTests,-formatting -DskipTests test-compile
          mvn -B --no-transfer-progress -pl core/sail/lmdb dependency:build-classpath -Dmdep.outputFile=target/coordinate-bench-classpath.txt -Dmdep.includeScope=test
      - name: Matched AUTO coordinate ablations with ABBA ordering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coordinate-results
          cp="core/sail/lmdb/target/test-classes:core/sail/lmdb/target/classes:$(cat core/sail/lmdb/target/coordinate-bench-classpath.txt)"
          printf 'commit=%s\\njava=' "$GITHUB_SHA" | tee coordinate-results/environment.txt
          java -version 2>&1 | tee -a coordinate-results/environment.txt
          for mode in false true true false; do
            i=$(find coordinate-results -name '*.json' | wc -l)
            label="$(printf '%02d' "$i")-coordinate-$mode"
            echo "=== $label: AUTO (no forced strategy), coordinates=$mode ===" | tee "coordinate-results/$label.txt"
            java -Xms1g -Xmx3g -Drdf4j.lmdb.resultCoordinates.enabled="$mode" -cp "$cp" \
              org.eclipse.rdf4j.sail.lmdb.benchmark.OptionalFanoutBenchmark --dimensions 40 4 \
              >> "coordinate-results/$label.txt" 2>&1
            java -cp "$cp" org.openjdk.jmh.Main '.*OptionalFanoutBenchmark.runQuery' \
              -p measurementCount=40 -p readingsPerMeasurement=4 \
              -f 1 -wi 2 -w 1s -i 5 -r 1s -prof gc \
              -jvmArgsAppend "-Xms1g -Xmx3g -Drdf4j.lmdb.resultCoordinates.enabled=$mode" \
              -rf json -rff "coordinate-results/$label.json" \
              >> "coordinate-results/$label.txt" 2>&1
          done
      - name: Preserve actual JMH results and executed routes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinate-abba-jmh
          path: coordinate-results/
          if-no-files-found: ignore
          retention-days: 14
