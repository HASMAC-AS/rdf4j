name: Canonical wait and namespace validation

on:
  push:
    branches: [GH-0000-canonical-wait-cache-ci]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 5a556230008d29dd586fad73be58f6f976c5fcf1
      - name: Preserve the pinned sources
        run: |
          mkdir -p "$RUNNER_TEMP/wait-cache-source"
          git archive --format=tar.gz HEAD AGENTS.md pom.xml .mvn core/sail/lmdb/src core/sail/lmdb/pom.xml > "$RUNNER_TEMP/wait-cache-source/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: wait-cache-source
          path: ${{ runner.temp }}/wait-cache-source/
          retention-days: 3
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Use the repository Maven cache path
        run: |
          mkdir -p "$HOME/.m2/repository"
          test -e .m2_repo || ln -s "$HOME/.m2/repository" .m2_repo
      - name: Build dependencies without tests
        run: mvn -B -ntp -Dmaven.repo.local=.m2_repo -pl core/sail/lmdb -am install -Pquick -DskipTests -DskipITs -DskipFrontend=true
      - name: Reproduce both reported failures
        run: |
          mkdir -p "$RUNNER_TEMP/wait-cache-red"
          status=0
          mvn -B -ntp -Dmaven.repo.local=.m2_repo -pl core/sail/lmdb test '-Dtest=AsyncSignalTest,ValueStoreIdCacheTest#namespaceCreationAcrossGrowthCheckpointWarmsNextWriter' -DskipITs -PskipSlowTests,-formatting -Dmaven.javadoc.skip -Djapicmp.skip -Denforcer.skip -Danimal.sniffer.skip > "$RUNNER_TEMP/wait-cache-red/maven.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/wait-cache-red/maven.log"
          test "$status" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = {'aSlowYieldSpinParksOnceItsTimeBudgetIsSpent', 'namespaceCreationAcrossGrowthCheckpointWarmsNextWriter(File)'}
          seen = set()
          for report in Path('core/sail/lmdb/target/surefire-reports').glob('TEST-*.xml'):
              root = ET.parse(report).getroot()
              for case in root.findall('testcase'):
                  if case.find('failure') is not None:
                      print('REPRODUCED', root.attrib['name'], case.attrib['name'])
                      seen.add(case.attrib['name'])
          assert 'aSlowYieldSpinParksOnceItsTimeBudgetIsSpent' in seen, seen
          assert any(s.startswith('namespaceCreationAcrossGrowthCheckpointWarmsNextWriter') for s in seen), seen
          PY
      - name: Preserve reproduction evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/wait-cache-red"
          if test -d core/sail/lmdb/target/surefire-reports; then
            cp -a core/sail/lmdb/target/surefire-reports "$RUNNER_TEMP/wait-cache-red/reports"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wait-cache-red
          path: ${{ runner.temp }}/wait-cache-red/
          retention-days: 7
