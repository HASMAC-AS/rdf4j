name: RDF parser query extensions

on:
  push:
    branches: [ 'feature/rdf-parser-query-extensions' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 20
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build prerequisites from source
        shell: bash
        run: |
          if ! mvn -B -ntp -U -pl core/sail/rdf-parser -am -DskipTests -DskipITs -Dmaven.javadoc.skip=true clean install > /tmp/rdf-parser-build.log 2>&1; then
            tail -120 /tmp/rdf-parser-build.log
            exit 1
          fi
          tail -35 /tmp/rdf-parser-build.log
      - name: Run all module tests
        shell: bash
        run: |
          if ! mvn -B -ntp -nsu -pl core/sail/rdf-parser test > /tmp/rdf-parser-test.log 2>&1; then
            tail -120 /tmp/rdf-parser-test.log
            exit 1
          fi
          tail -35 /tmp/rdf-parser-test.log
      - name: Compare original and optimized code with JMH
        shell: bash
        run: |
          if ! bash core/sail/rdf-parser/benchmark.sh > /tmp/rdf-parser-benchmark.log 2>&1; then
            tail -80 /tmp/rdf-parser-benchmark.log
            for log in core/sail/rdf-parser/target/benchmarks/*.log; do tail -60 "$log"; done
            exit 1
          fi
          tail -20 /tmp/rdf-parser-benchmark.log
      - name: Print test summaries and measurement evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('core/sail/rdf-parser/target')
          for report in sorted((root / 'surefire-reports').glob('TEST-*.xml')):
              suite = ET.parse(report).getroot()
              print({key: suite.get(key) for key in ('name', 'tests', 'failures', 'errors', 'skipped')})
              for case in suite.findall('testcase'):
                  for error in list(case.findall('failure')) + list(case.findall('error')):
                      print(case.get('name'), error.get('message'))
                      print('\n'.join((error.text or '').splitlines()[:12]))
          for report in sorted((root / 'benchmarks').glob('*-*.json')):
              for row in json.loads(report.read_text()):
                  print('JMH_RESULT ' + json.dumps({'file': report.name, 'benchmark': row['benchmark'],
                      'params': row.get('params', {}), 'jvm': row['jvm'], 'jdkVersion': row['jdkVersion'],
                      'primaryMetric': row['primaryMetric'],
                      'allocation': row['secondaryMetrics'].get('gc.alloc.rate.norm')}))
          PY
      - name: Retain test and benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdf-parser-verification
          path: |
            core/sail/rdf-parser/src/
            core/sail/rdf-parser/target/surefire-reports/
            core/sail/rdf-parser/target/benchmarks/*.json
            core/sail/rdf-parser/target/benchmarks/*.log
