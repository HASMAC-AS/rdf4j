name: Recover SPARQL correctness corpus
on:
  push:
    branches: [test/sparql-corpus-recovery-20261005]
permissions:
  contents: read
concurrency:
  group: sparql-corpus-recovery
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the defined source-patch baseline
        run: git fetch --no-tags --depth=1 origin a5ebbdb03ac304f69e054c90c4d9fb1cc8b100a3
      - name: Checkpoint complete implementation source
        run: python3 suite/tools/package.py initial
      - uses: actions/upload-artifact@v4
        with:
          name: source-checkpoint
          path: deliverables/
          retention-days: 30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Import the pinned HASMAC-AS forks
        id: import
        run: |
          set -o pipefail
          mkdir -p suite/reports
          python3 -m pip install --break-system-packages -r suite/requirements.txt
          python3 -m unittest discover -s suite/tools -p 'test_*.py' -v 2>&1 | tee suite/reports/python-tests.log
          python3 suite/tools/build_corpus.py --download
          python3 suite/tools/runner_registration.py
      - name: Checkpoint implementation plus corpus
        if: always()
        run: python3 suite/tools/package.py imported
      - name: Compile and execute Jupiter tests
        id: java
        if: steps.import.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p suite/reports
          java -version 2>&1 | tee suite/reports/java-version.txt
          timeout 30m mvn -B -ntp -f suite/pom.xml -DfailIfNoTests=true test > suite/reports/maven.log 2>&1
      - name: Audit saved failures with the exact pinned Jena comparator
        id: oracle
        if: steps.import.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 suite/tools/run_reference_audit.py
      - name: Save actual outcomes and final source ZIP
        if: always()
        env:
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
        run: |
          python3 suite/tools/report.py
          python3 suite/tools/report_extras.py
          python3 suite/tools/package.py final
          if [ -f suite/reports/reference-audit-tail.txt ]; then cat suite/reports/reference-audit-tail.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-source-corpus-and-results
          path: deliverables/
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            suite/reports/verification.json
            suite/reports/cohort-summary.json
            suite/reports/native-failures.json
            suite/reports/qlever-failures.json
            suite/reports/failure-sample.json
            suite/reports/import-gaps.json
            suite/reports/diagnostic-tail.txt
            suite/reports/python-tests.log
            suite/reports/reference-audit-execution.json
            suite/reports/reference-audit-tail.txt
            suite/reports/upstream-oracle-summary.json
            suite/reports/upstream-oracle-audit.json
            suite/reports/upstream-comparison-policy-sites.json
            suite/reports/patch-verification.json
            suite/corpus/native-audit.json
            suite/corpus/registration-summary.json
            deliverables/snapshot.json
          retention-days: 30
      - name: Preserve failing test status
        if: steps.java.outcome != 'success'
        run: exit 1
