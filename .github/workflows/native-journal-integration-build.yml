name: Native journal integration build
on:
  push:
    branches: [work/native-transaction-journal]
    paths: [.github/workflows/native-journal-integration-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build NativeStore and repository dependencies
        run: mvn -B -pl core/sail/nativerdf,core/repository/sail -am -DskipTests -DskipITs -Dmaven.javadoc.skip=true -Dspotless.apply.skip=true -Dspotless.check.skip=true -Djapicmp.skip=true -Denforcer.skip=true install
      - name: Export runnable classpath
        run: |
          mkdir -p /tmp/native-classpath
          mvn -B -f core/sail/nativerdf/pom.xml dependency:copy-dependencies -DincludeScope=test -DoutputDirectory=/tmp/native-classpath
          mvn -B -f core/repository/sail/pom.xml dependency:copy-dependencies -DincludeScope=test -DoutputDirectory=/tmp/native-classpath
          cp core/sail/nativerdf/target/rdf4j-sail-nativerdf-*.jar core/repository/sail/target/rdf4j-repository-sail-*.jar /tmp/native-classpath/
      - uses: actions/upload-artifact@v4
        with:
          name: native-journal-integration-classpath
          path: /tmp/native-classpath/*.jar
          retention-days: 3
