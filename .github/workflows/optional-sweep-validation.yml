name: OPTIONAL sweep regression validation

on:
  push:
    branches:
      - GH-6412-optional-sweep-validation

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 41a427e48fd8760c40d9d7ab0a434b908c6c0ee3
          fetch-depth: 8
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Verify the exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 41a427e48fd8760c40d9d7ab0a434b908c6c0ee3
          test "$(git hash-object core/sail/lmdb/src/main/java/org/eclipse/rdf4j/sail/lmdb/evaluation/LmdbNativeLeftJoinMemo.java)" = aa992d021f64661259898e9c4342e32db0c6b067
          test "$(git hash-object core/sail/lmdb/src/test/java/org/eclipse/rdf4j/sail/lmdb/evaluation/NativeOptionalSweepLookupTest.java)" = 8ea07d62947b0df8bf1e2f91e9c0ae249bacf0ef
          git show -s --format=fuller HEAD
          grep -m 1 '<version>' pom.xml
          java -version
      - name: Check formatting
        run: mvn -B -Pformatting -pl core/sail/lmdb spotless:check
      - name: Compile dependencies and test classes
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -T 2C test-compile --fail-at-end -DskipTests -Pquick > "$RUNNER_TEMP/optional-compile.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/optional-compile.log"; exit 1; }
          tail -n 40 "$RUNNER_TEMP/optional-compile.log"
      - name: Install the compiled reactor
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -T 2C install --fail-at-end -Pquick > "$RUNNER_TEMP/optional-install.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/optional-install.log"; exit 1; }
          tail -n 40 "$RUNNER_TEMP/optional-install.log"
      - name: Prove the regression on the original implementation
        shell: bash
        run: |
          set -euo pipefail
          source=core/sail/lmdb/src/main/java/org/eclipse/rdf4j/sail/lmdb/evaluation/LmdbNativeLeftJoinMemo.java
          git show 4e792519835dd198f92c7670a27911cd0c92946f:"$source" > "$source"
          set +e
          mvn -B -pl core/sail/lmdb test -Dtest=NativeOptionalSweepLookupTest -DskipITs -PskipSlowTests,-formatting -Dmaven.javadoc.skip -Djapicmp.skip -Denforcer.skip -Danimal.sniffer.skip > "$RUNNER_TEMP/optional-sweep-base.log" 2>&1
          result=$?
          set -e
          git restore -- "$source"
          tail -n 100 "$RUNNER_TEMP/optional-sweep-base.log"
          if [[ "$result" == 0 ]]; then
            echo 'Regression test unexpectedly passed against the original implementation.'
            exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'core/sail/lmdb/target/surefire-reports/TEST-org.eclipse.rdf4j.sail.lmdb.evaluation.NativeOptionalSweepLookupTest.xml'
          suite = ET.parse(path).getroot()
          assert suite.attrib['tests'] == '2', suite.attrib
          assert suite.attrib['errors'] == '0', suite.attrib
          failures = suite.findall('testcase/failure')
          assert len(failures) == 2, suite.attrib
          for failure in failures:
              message = failure.attrib.get('message', '') + (failure.text or '')
              assert 'index' in message and 'scan' in message, message
          print('Both resident and spilled cases reproduce the missing keyed lookup on the original source.')
          PY
      - name: Run fixed regression and related OPTIONAL tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -pl core/sail/lmdb test -Dtest=NativeOptionalSweepLookupTest,LmdbNativeLeftJoinSweepTest,LmdbNativeInnerJoinSweepTest,NativeOptionalProbeDemandTest,NativeOptionalCorrelatedMemoBudgetTest,OptionalCompatibilityIndexTest,OptionalCompatibilityIndexMultiplicityTest -DskipITs -PskipSlowTests,-formatting -Dmaven.javadoc.skip -Djapicmp.skip -Denforcer.skip -Danimal.sniffer.skip > "$RUNNER_TEMP/optional-sweep-fixed.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/optional-sweep-fixed.log"; exit 1; }
          tail -n 100 "$RUNNER_TEMP/optional-sweep-fixed.log"
      - name: Confirm tested sources match the pushed commit
        run: git diff --exit-code
