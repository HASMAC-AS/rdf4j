name: ChatGPT format

on:
  push:
    branches:
      - chatgpt/var-slot-masks-20260606

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[chatgpt-format]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/var-slot-masks-20260606
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run Maven process-resources
        run: mvn -B process-resources
      - name: Commit formatted changes
        run: |
          git config user.name "chatgpt-codex"
          git config user.email "chatgpt-codex@users.noreply.github.com"
          git rm .github/workflows/chatgpt-format.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
          else
            git commit -m "Apply Maven formatting"
            git push origin chatgpt/var-slot-masks-20260606
          fi
