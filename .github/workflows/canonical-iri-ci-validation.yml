name: Canonical IRI focused CI validation

on:
  push:
    branches: [GH-0000-canonical-iri-ci-validation]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4e635dd65211bf38033dc0dc47fe329def152b03
      - name: Preserve relevant pinned sources without large datasets
        run: |
          mkdir -p "$RUNNER_TEMP/canonical-ci-source"
          git archive --format=tar.gz HEAD core/sail/lmdb/src/main/java core/sail/lmdb/src/test/java core/sail/base/src/main/java core/queryalgebra/evaluation/src/main/java core/sail/lmdb/pom.xml pom.xml .mvn AGENTS.md > "$RUNNER_TEMP/canonical-ci-source/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-ci-focused-source
          path: ${{ runner.temp }}/canonical-ci-source/source.tar.gz
          retention-days: 3
