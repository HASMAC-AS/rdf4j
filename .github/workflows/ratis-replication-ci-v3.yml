name: Ratis Replication Sail CI v3

on:
  workflow_dispatch:
  push:
    branches:
      - ratis-replication-2pc-si-5.3.2
    paths:
      - '.ci/ratis-project.b64.part*'
      - '.ci/overlay-v2.b64.part*'
      - '.ci/overlay-v3.b64.part*'
      - '.ci/overlay/**'
      - '.github/workflows/ratis-replication-ci-v3.yml'

permissions:
  contents: read

jobs:
  build-test-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Reconstruct project and overlays
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ratis-project
          mkdir -p /tmp/ratis-project

          cat .ci/ratis-project.b64.part* | tr -d '\r\n\t ' | base64 --decode > /tmp/base.zip
          echo '77cfe72ddde266256c2434a4bd603a469c6ae47aea6274990d3e8068289bba16  /tmp/base.zip' | sha256sum --check
          unzip -q /tmp/base.zip -d /tmp/ratis-project

          cat .ci/overlay-v2.b64.part* | tr -d '\r\n\t ' | base64 --decode > /tmp/overlay-v2.zip
          echo 'e1b57acdfd6663efdf3f413f1da1a1ad2085965fe0e9d2d2f7f087751b5576a4  /tmp/overlay-v2.zip' | sha256sum --check
          unzip -q -o /tmp/overlay-v2.zip -d /tmp/ratis-project

          PROJECT=/tmp/ratis-project python3 - <<'PY'
          import base64
          import io
          import itertools
          import os
          import pathlib
          import zipfile

          parts = [
              pathlib.Path('.ci/overlay-v3.b64.part00'),
              pathlib.Path('.ci/overlay-v3.b64.part01'),
              pathlib.Path('.ci/overlay-v3.b64.part02'),
          ]
          encoded = ''.join(''.join(p.read_text().split()) for p in parts)
          trailing = len(encoded) - len(encoded.rstrip('='))
          body_end = len(encoded) - trailing
          internal = [i for i, ch in enumerate(encoded[:body_end]) if ch == '=']
          print(f'v3 encoded length={len(encoded)} trailing_padding={trailing} internal_padding={internal}')
          if len(encoded) % 4:
              raise SystemExit(f'v3 encoded length is not divisible by four: {len(encoded)}')
          if len(internal) > 3:
              raise SystemExit(f'too many corrupt internal padding characters to recover safely: {internal}')

          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          candidates = itertools.product(alphabet, repeat=len(internal)) if internal else [()]
          best = None
          attempted = 0
          for replacements in candidates:
              attempted += 1
              chars = list(encoded)
              for pos, replacement in zip(internal, replacements):
                  chars[pos] = replacement
              try:
                  data = base64.b64decode(''.join(chars), validate=True)
                  with zipfile.ZipFile(io.BytesIO(data)) as zf:
                      names = zf.namelist()
                      if 'pom.xml' not in names or not any(name.endswith('RatisClusterRuntime.java') for name in names):
                          continue
                      good = {}
                      bad = []
                      for info in zf.infolist():
                          if info.is_dir():
                              good[info.filename] = None
                              continue
                          try:
                              good[info.filename] = zf.read(info)
                          except (zipfile.BadZipFile, RuntimeError, EOFError, OSError) as error:
                              bad.append((info.filename, type(error).__name__, str(error)))
                  score = (len(good), -len(bad))
                  if best is None or score > best[0]:
                      best = (score, replacements, data, names, good, bad)
              except (ValueError, zipfile.BadZipFile, RuntimeError, EOFError):
                  continue

          if best is None:
              raise SystemExit(f'could not parse any v3 overlay candidate after {attempted} attempts')

          score, replacements, data, names, good, bad = best
          pathlib.Path('/tmp/overlay-v3-recovered.zip').write_bytes(data)
          project = pathlib.Path(os.environ['PROJECT']).resolve()
          for name, payload in good.items():
              target = (project / name).resolve()
              if project != target and project not in target.parents:
                  raise SystemExit(f'unsafe archive path: {name}')
              if payload is None:
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)

          report = [
              f'attempted={attempted}',
              f'replacements={replacements}',
              f'entries={len(names)}',
              f'crc_valid_entries={len(good)}',
              f'damaged_entries={len(bad)}',
          ]
          report.extend(f'damaged={name} error={kind}: {message}' for name, kind, message in bad)
          report_text = '\n'.join(report) + '\n'
          pathlib.Path('/tmp/overlay-v3-recovery.txt').write_text(report_text)
          print(report_text, end='')
          if len(good) < len(names) - 2:
              raise SystemExit('more than two v3 overlay entries are damaged; refusing partial recovery')
          PY

          sha256sum /tmp/overlay-v3-recovered.zip | tee /tmp/overlay-v3.sha256

          if [ -d .ci/overlay ]; then
            cp -a .ci/overlay/. /tmp/ratis-project/
          fi
          mkdir -p /tmp/ratis-project/build-results
          cp /tmp/overlay-v3.sha256 /tmp/ratis-project/build-results/
          cp /tmp/overlay-v3-recovery.txt /tmp/ratis-project/build-results/

      - name: Maven test
        working-directory: /tmp/ratis-project
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -e -DtrimStackTrace=false test 2>&1 | tee build-results/mvn-test.log

      - name: Maven package
        working-directory: /tmp/ratis-project
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -DskipTests package 2>&1 | tee build-results/mvn-package.log

      - name: Full-transaction throughput benchmark
        working-directory: /tmp/ratis-project
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp \
            -Dratis.benchmark=true \
            -Dratis.benchmark.transactions=20000 \
            -Dratis.benchmark.warmup=2000 \
            -Dratis.benchmark.concurrency=256 \
            -Dtest=ThroughputBenchmarkTest test 2>&1 | tee build-results/benchmark.log

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/ratis-project/build-results
          cd /tmp/ratis-project
          java -version > build-results/java-version.log 2>&1
          mvn -version > build-results/maven-version.log 2>&1
          find target -maxdepth 4 -type f -print | sort > build-results/target-files.log 2>&1
          zip -qr /tmp/ratis-project-result.zip . -x 'target/surefire-reports/*.dumpstream'

      - name: Upload complete result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratis-replication-v3-result
          path: /tmp/ratis-project-result.zip
          if-no-files-found: error
          retention-days: 7
